services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-node
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logstash-query.sql:/usr/share/logstash/config/logstash-query.sql   # ← đổi chỗ này
      - ./postgresql-42.7.9.jar:/usr/share/logstash/lib/postgresql-42.7.9.jar
      - logstash_data:/usr/share/logstash/data
    environment:
      - DB_USER=${DB_USER:-neondb_owner}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - opensearch

volumes:
  logstash_data:
