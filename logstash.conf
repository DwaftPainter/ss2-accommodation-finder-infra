input {
  jdbc {
    ecs_compatibility => disabled
    jdbc_driver_library => "/usr/share/logstash/lib/postgresql-42.7.9.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "${JDBC_CONNECTION_STRING:jdbc:postgresql://postgres:5432/neondb}"
    jdbc_user => "${DB_USER}"
    jdbc_password => "${DB_PASSWORD}"
    schedule => "* * * * *"
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    use_column_value => true
    last_run_metadata_path => "/usr/share/logstash/data/.logstash_jdbc_last_run"
    statement_filepath => "/usr/share/logstash/config/logstash-query.sql"
  }
}

filter {
  mutate {
    ecs_compatibility => disabled
    rename => {
      "electricity_fee" => "electricityFee"
      "water_fee"       => "waterFee"
      "contact_name"    => "contactName"
      "contact_phone"   => "contactPhone"
      "view_count"      => "viewCount"
      "expired_at"      => "expiredAt"
      "created_at"      => "createdAt"
      "updated_at"      => "updatedAt"
      "owner_name"      => "ownerName"
      "owner_phone"     => "ownerPhone"
      "full_address"    => "fullAddress"
    }
    remove_field => ["@version", "@timestamp"]
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "listings"
    document_id => "%{id}"
  }
}